services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emploi-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=file:/app/data/dev.db
    volumes:
      - backend_data:/app/data
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - emploi-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: emploi-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - emploi-network

volumes:
  backend_data:
    driver: local

networks:
  emploi-network:
    driver: bridge
